# Environment for the agrisignal-mlflow Cloud Run service (scripts/deploy.ps1).
# `mlflow server` reads all of its options from these variables, which avoids
# escaping commas and wildcards on the gcloud command line.
MLFLOW_HOST: "0.0.0.0"
MLFLOW_PORT: "8080"
MLFLOW_WORKERS: "1"
# Same bucket mount and path the pipeline job writes to
MLFLOW_BACKEND_STORE_URI: "file:///app/data/mlruns"
# Host-header allowlist: the service's run.app URL, and localhost for
# `gcloud run services proxy`
MLFLOW_SERVER_ALLOWED_HOSTS: "*.run.app,localhost:*,127.0.0.1:*"
